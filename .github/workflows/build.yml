name: Build native firmware tools
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['codex/runtime-templates']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            python: '3.8.10'
            requirements: requirements-windows.txt
            platform: windows-x64
          - os: macos-15
            python: '3.11'
            requirements: requirements.txt
            platform: macos-arm64
          - os: macos-15-intel
            python: '3.11'
            requirements: requirements.txt
            platform: macos-x64
          - os: ubuntu-22.04
            python: '3.11'
            requirements: requirements.txt
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 libhidapi-hidraw0 libusb-1.0-0
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: release/${{ matrix.platform }}.qmk-runtime.zip
      - name: Make bundled example (Windows/Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          if [ "$RUNNER_OS" = Linux ]; then ext=".tar.gz"; fi
          python tools/make_package.py --firmware mk20b_via_v9.hex --runtime "release/${{ matrix.platform }}.qmk-runtime.zip" --output "release/${{ matrix.platform }}/mk20b_via_v9_update$ext"
          python tools/make_package.py --firmware mk20b_via_v9.hex --mode continuous --runtime "release/${{ matrix.platform }}.qmk-runtime.zip" --output "release/${{ matrix.platform }}/factory/mk20b_via_v9_update$ext"
      - name: Make bundled example (macOS)
        if: runner.os == 'macOS'
        run: |
          python tools/make_package.py --firmware mk20b_via_v9.hex --runtime release/${{ matrix.platform }}.qmk-runtime.zip --output release/${{ matrix.platform }}/mk20b_via_v9_update.zip
          python tools/make_package.py --firmware mk20b_via_v9.hex --mode continuous --runtime release/${{ matrix.platform }}.qmk-runtime.zip --output release/${{ matrix.platform }}/factory/mk20b_via_v9_update.zip
      - name: Verify frozen startup and macOS application signatures
        run: python tools/smoke_ci.py --target ${{ matrix.platform }}
      - name: Archive release (preserve executable bits and app symlinks)
        shell: bash
        run: tar -czf "release/${{ matrix.platform }}.tar.gz" -C release "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: QMK-${{ matrix.platform }}
          path: release/${{ matrix.platform }}.tar.gz
  all-templates:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: templates
          merge-multiple: true
      - run: python -c "from pathlib import Path; import zipfile; z=zipfile.ZipFile('QMK-All-System-Templates.zip','w',zipfile.ZIP_STORED); [z.write(p,p.as_posix()) for p in Path('templates').glob('*.qmk-runtime.zip')]; z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: QMK-All-System-Templates
          path: QMK-All-System-Templates.zip
